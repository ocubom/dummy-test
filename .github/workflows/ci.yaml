name: CI

on:
    pull_request: ~
    push:
        branches: [ "main" ]

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    static-analysis:
        name: Static Analysis
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    ini-values: date.timezone=UTC, memory_limit=-1, max_execution_time=-1
                    coverage: none

            -   name: Composer install
                uses: ramsey/composer-install@v4

            -   name: PHPStan
                run: vendor/bin/phpstan analyse --error-format=github

    test:
        name: PHP ${{ matrix.php }} on ${{ matrix.os }}${{ matrix.coverage && '*' || '' }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - macos-latest
                    - ubuntu-latest
                    - windows-latest
                php:
                    - '8.5'
                    - '8.4'
                    - '8.3'
                    - '8.2'
                    - '8.1'
                include:
                    ## Generate coverage report on linux
                    - php: '8.4'
                      os: ubuntu-latest
                      coverage: pcov
        env:
            OS: ${{ matrix.os }}
            PHP: ${{ matrix.php }}
        steps:
            -   name: Configure git to avoid issues with line endings
                if: ${{ runner.os == 'Windows' }}
                run: git config --global core.autocrlf false

            -   name: Configure GNU tar on windows
                if: ${{ runner.os == 'Windows' }}
                shell: cmd
                run: echo C:\Program Files\Git\usr\bin>>"%GITHUB_PATH%"

            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    # @see RepositoryIntrospector at scrutinizer-ci/ocular GitHub repository
                    fetch-depth: ${{ matrix.coverage && 10 || 1 }}

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    ini-values: date.timezone=UTC, memory_limit=-1, max_execution_time=-1
                    coverage: ${{ matrix.coverage || 'none' }}

            -   name: Composer install
                uses: ramsey/composer-install@v4
                env:
                    SYMFONY_REQUIRE: ${{ matrix.symfony || '' }}
                with:
                    composer-options: ${{ matrix.composer-options }}
                    dependency-versions: ${{ matrix.dependencies }}

            -   name: Run test suite
                run: vendor/bin/phpunit --log-junit junit.xml ${{ matrix.coverage && ' --coverage-clover=coverage.xml ' || '' }}

            -   name: Upload coverage to Codecov
                if: ${{ matrix.coverage }}
                uses: codecov/codecov-action@v7
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    env_vars: OS,PHP

            -   name: Upload test results to Codecov
                if: ${{ !cancelled() }}
                uses: codecov/codecov-action@v7
                with:
                    token: ${{ secrets.CODECOV_TOKEN }}
                    env_vars: OS,PHP
                    files: ./junit.xml
                    report_type: test_results
